name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit repository security policy and history
        run: python3 tools/security_audit.py --history
      - name: Build native tests
        run: cmake -S tests -B build-tests
      - name: Run native tests
        run: |
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  esp32p4-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official ESP-IDF v5.5.4 multi-platform image, pinned by digest.
      image: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build credential-free target configuration
        run: |
          . /opt/esp/idf/export.sh
          export ESP32_P4_OTA_SECRETS_DIR="$RUNNER_TEMP/no-credentials-present"
          idf.py -B build-ci \
            -DIDF_TARGET=esp32p4 \
            -DSDKCONFIG="$RUNNER_TEMP/esp32-p4-sdkconfig" \
            "-DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults;$GITHUB_WORKSPACE/tests/sdkconfig.no_ota.defaults" \
            reconfigure build size
      - name: Verify CI security boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("build-ci/config/sdkconfig.json").read_text())
          assert config["OTA_HTTPS_ENABLED"] is False
          assert config["BOOTLOADER_APP_ROLLBACK_ENABLE"] is True
          assert config["ESP_TASK_WDT_PANIC"] is True
          assert config["ESP_COREDUMP_ENABLE_TO_NONE"] is True
          image = Path("build-ci/esp32_p4_bacnet_switches.bin").read_bytes()
          assert b"-----BEGIN PRIVATE KEY-----" not in image
          PY
