name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run the same host checks used by contributors and agents
        run: python3 tools/run_host_tests.py

  esp32p4-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official ESP-IDF v5.5.4 multi-platform image, pinned by digest.
      image: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build credential-free target configuration
        run: |
          . /opt/esp/idf/export.sh
          umask 077
          python3 tools/firmware_signing.py generate-key \
            --public-key "$RUNNER_TEMP/ci-signing-public.pem"
          export ESP32_P4_OTA_SECRETS_DIR="$RUNNER_TEMP/no-credentials-present"
          idf.py -B build-ci \
            -DIDF_TARGET=esp32p4 \
            -DSDKCONFIG="$RUNNER_TEMP/esp32-p4-sdkconfig" \
            "-DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults;$GITHUB_WORKSPACE/tests/sdkconfig.no_ota.defaults" \
            reconfigure build size
      - name: Verify CI security boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("build-ci/config/sdkconfig.json").read_text())
          assert config["OTA_HTTPS_ENABLED"] is False
          assert config["BOOTLOADER_APP_ROLLBACK_ENABLE"] is True
          assert config["ESP_TASK_WDT_PANIC"] is True
          assert config["ESP_COREDUMP_ENABLE_TO_NONE"] is True
          assert config["SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT"] is True
          assert config["SECURE_SIGNED_APPS_RSA_SCHEME"] is True
          assert config["SECURE_BOOT"] is False
          assert config["SECURE_FLASH_ENC_ENABLED"] is False
          assert not config.get("BOOTLOADER_APP_ANTI_ROLLBACK")
          assert not config.get("SECURE_DISABLE_ROM_DL_MODE")
          assert not config.get("SECURE_ENABLE_SECURE_ROM_DL_MODE")
          image = Path("build-ci/esp32_p4_bacnet_switches.bin").read_bytes()
          assert b"-----BEGIN PRIVATE KEY-----" not in image
          PY
          PYTHONPATH=tools python3 - <<'PY'
          import os
          from pathlib import Path
          from ota_client import _inspect_firmware
          metadata = _inspect_firmware(
              Path("build-ci/esp32_p4_bacnet_switches.bin"),
              Path(os.environ["RUNNER_TEMP"]) / "ci-signing-public.pem",
              require_signature=True,
          )
          assert metadata.signed and metadata.signing_key_sha256
          PY
